<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="soundings">
  <title>soundings</title>
  <!-- A sounding line: the graticule it is read against, the line itself, and
       the weight at the bottom that took the measurement. -->
  <rect width="32" height="32" rx="4" fill="#0b0e11" />
  <g stroke="#7ed3e0" stroke-width="1" stroke-linecap="square">
    <path d="M7 10h18" opacity="0.28" />
    <path d="M7 16h18" opacity="0.28" />
    <path d="M7 22h18" opacity="0.28" />
    <path d="M16 5v18" />
  </g>
  <circle cx="16" cy="25" r="2.5" fill="#e0a94b" />
</svg>
